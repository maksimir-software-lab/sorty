plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.8.0'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sorty" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "sorty-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

spotless {
	java {
		target 'src/**/*.java'
		importOrder()
		removeUnusedImports()
		eclipse().configProperties('''
			org.eclipse.jdt.core.formatter.alignment_for_expressions_in_array_initializer=48
			org.eclipse.jdt.core.formatter.alignment_for_parameters_in_constructor_declaration=52
			org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=52
			org.eclipse.jdt.core.formatter.blank_lines_before_abstract_method=1
			org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=1
			org.eclipse.jdt.core.formatter.insert_new_line_before_closing_brace_in_array_initializer=insert
			org.eclipse.jdt.core.formatter.number_of_blank_lines_before_code_block=1
			org.eclipse.jdt.core.formatter.number_of_blank_lines_after_code_block=1
			org.eclipse.jdt.core.formatter.parentheses_positions_in_method_delcaration=separate_lines_if_wrapped
		''')
		formatAnnotations()
		custom 'keep short array initializers compact', { source ->
			source.replaceAll(/(?m)^([^\n{}]*\{[^\n{}]+)\n[ \t]*(\}\s*[;,)]*)$/, '$1$2')
		}
		custom 'group consecutive abstract methods by return type', { source ->
			def lines = source.split('\n', -1) as List
			def returnTypeOf = { signatureLines ->
				def signature = signatureLines.collect { it.trim() }.join(' ')
				def beforeParameters = signature.take(signature.indexOf('('))

				if (beforeParameters.contains('=')) {
					return null
				}

				def matcher = signature =~ /^(?:(?:public|protected|private|static|default|abstract|strictfp|synchronized|native)\s+)*(?:<[^>]+>\s+)?(.+?)\s+[A-Za-z_$][\w$]*\s*\(.*\)\s*(?:throws\s+.*)?;$/

				matcher.matches() ? matcher.group(1).replaceAll(/\s+/, ' ') : null
			}
			def formatted = []
			def index = 0

			while (index < lines.size()) {
				def line = lines[index]

				if (line.trim().isEmpty() && !formatted.isEmpty() && index + 1 < lines.size()) {
					def previousEnd = formatted.size() - 1
					def previousStart = previousEnd

					while (previousStart >= 0 && !formatted[previousStart].contains('(')
							&& !formatted[previousStart].contains('{') && !formatted[previousStart].contains('}')) {
						previousStart--
					}

					def nextEnd = index + 1
					while (nextEnd < lines.size() && !lines[nextEnd].trim().endsWith(';')
							&& !lines[nextEnd].contains('{') && !lines[nextEnd].contains('}')) {
						nextEnd++
					}

					if (previousStart >= 0 && formatted[previousEnd].trim().endsWith(';') && nextEnd < lines.size()
							&& lines[nextEnd].trim().endsWith(';')) {
						def previousType = returnTypeOf(formatted[previousStart..previousEnd])
						def nextType = returnTypeOf(lines[(index + 1)..nextEnd])

						if (previousType != null && previousType == nextType) {
							index++
							continue
						}
					}
				}

				formatted.add(line)
				index++
			}

			formatted.join('\n')
		}
		custom 'blank line before non-leading return', { source ->
			def lines = source.split('\n', -1) as List
			def formatted = []

			lines.each { line ->
				if (line ==~ /^\s*return(?:\s|;).*/ && !formatted.isEmpty()) {
					def previous = formatted.last().trim()
					def returnIsFirstStatement = previous.isEmpty()
							|| previous.endsWith('{')
							|| previous.endsWith('->')
							|| previous ==~ /^(case\b.*|default)\s*:$/

					if (!returnIsFirstStatement) {
						formatted.add('')
					}
				}

				formatted.add(line)
			}

			formatted.join('\n')
		}
	}

	format 'projectFiles', {
		target '*.gradle', '*.properties', '*.md', '.gitignore', '.gitattributes', 'src/**/*.json'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

test {
	useJUnitPlatform()
}

def gametestJar = tasks.register("gametestJar", Jar) {
	archiveClassifier = "gametest-dev"
	destinationDirectory = layout.buildDirectory.dir("gametest")
	from sourceSets.gametest.output
}

def remapGametestJar = tasks.register("remapGametestJar", net.fabricmc.loom.task.RemapJarTask) {
	dependsOn gametestJar
	inputFile = gametestJar.flatMap { it.archiveFile }
	archiveClassifier = "gametest"
	destinationDirectory = layout.buildDirectory.dir("gametest")
}

def clientGameTestRunDirectory = layout.buildDirectory.dir("run/clientGameTest")

def deleteProductionClientGameTestRunDir = tasks.register("deleteProductionClientGameTestRunDir", Delete) {
	delete clientGameTestRunDirectory
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn deleteProductionClientGameTestRunDir
	dependsOn remapGametestJar
	mods.from remapGametestJar.flatMap { it.archiveFile }
	jvmArgs.add("-Dfabric.client.gametest")
	runDir = clientGameTestRunDirectory
	useXVFB = System.getenv("CI") != null
			&& System.getenv("DISPLAY") == null
			&& System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("linux")

	if (System.getenv("CI") != null) {
		programArgs.addAll("--width", "320", "--height", "240")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as Integer
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.version}+${project.minecraft_version}-${project.mod_loader}"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
