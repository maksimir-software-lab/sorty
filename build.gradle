plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.8.0'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sorty" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

spotless {
	java {
		target 'src/**/*.java'
		importOrder()
		removeUnusedImports()
		eclipse().configProperties('''
			org.eclipse.jdt.core.formatter.alignment_for_expressions_in_array_initializer=48
			org.eclipse.jdt.core.formatter.alignment_for_parameters_in_constructor_declaration=52
			org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=52
			org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=1
			org.eclipse.jdt.core.formatter.insert_new_line_before_closing_brace_in_array_initializer=insert
			org.eclipse.jdt.core.formatter.number_of_blank_lines_before_code_block=1
			org.eclipse.jdt.core.formatter.number_of_blank_lines_after_code_block=1
			org.eclipse.jdt.core.formatter.parentheses_positions_in_method_delcaration=separate_lines_if_wrapped
		''')
		formatAnnotations()
		custom 'keep short array initializers compact', { source ->
			source.replaceAll(/(?m)^([^\n{}]*\{[^\n{}]+)\n[ \t]*(\}\s*[;,)]*)$/, '$1$2')
		}
		custom 'blank line before non-leading return', { source ->
			def lines = source.split('\n', -1) as List
			def formatted = []

			lines.each { line ->
				if (line ==~ /^\s*return(?:\s|;).*/ && !formatted.isEmpty()) {
					def previous = formatted.last().trim()
					def returnIsFirstStatement = previous.isEmpty()
							|| previous.endsWith('{')
							|| previous.endsWith('->')
							|| previous ==~ /^(case\b.*|default)\s*:$/

					if (!returnIsFirstStatement) {
						formatted.add('')
					}
				}

				formatted.add(line)
			}

			formatted.join('\n')
		}
	}

	format 'projectFiles', {
		target '*.gradle', '*.properties', '*.md', '.gitignore', '.gitattributes', 'src/**/*.json'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(Jar).configureEach {
	archiveVersion = "${project.version}-${project.minecraft_version}"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
