# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: '0.11.32'
          python-version: '3.12.13'
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: resolve java version
        id: java
        shell: bash
        run: echo "version=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: lint release tooling
        run: |
          uv run --frozen ruff format --check scripts
          uv run --frozen ruff check scripts
      - name: test release tooling
        run: uv run --frozen scripts/test_release.py
      - name: build
        run: ./gradlew build

  minecraft-integration-test:
    name: mc integration test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: resolve java version
        id: java
        shell: bash
        run: echo "version=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: mc integration test
        run: ./gradlew runProductionClientGameTest
      - name: capture Minecraft client integration test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-client-test-output
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
